spring.application.name=demo

# ------------------------------------------------------------------
# Base de datos H2 en memoria (Paso 8 de la guia)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:biblioteca;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Ejecuta data.sql DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------
# Documentacion OpenAPI / Swagger UI
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
# ------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
